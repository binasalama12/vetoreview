# VetoReview — Forge app manifest (SKELETON)
# Codegeist 2026 · Category: Apps for Software Teams
# Bonus tracks targeted: Best Agents (rovo:agent + reusable actions),
# Best app with Atlassian MCP (rovo:mcp — see note at the bottom).
#
# STATUS: scaffold only. `app.id` is a placeholder — replace it with the id
# Forge generates on `forge register`. Module keys and function handlers are
# wired to the skeleton files under src/.

app:
  id: ari:cloud:ecosystem::app/53682c48-261e-4956-9f43-4b2b127f9ee6
  runtime:
    name: nodejs22.x

modules:
  # --- Rovo agent: the reviewer persona -------------------------------------
  # Judges planned actions by other agents/automations BEFORE they execute,
  # using the pure rules engine in src/rules/ plus (later) Rovo LLM reasoning.
  rovo:agent:
    - key: vetoreview-agent
      name: VetoReview
      description: >-
        Safety reviewer for other agents in Jira and Confluence. Assesses
        planned actions, detects prompt-injection and high-risk patterns,
        and returns ALLOW, HOLD-FOR-REVIEW or VETO with reasons. Never
        executes the reviewed action itself.
      prompt: src/agent/prompt.md
      conversationStarters:
        - Assess the risk of the last comment on this issue
        - Why was this action vetoed?
        - Show the audit log for this issue
      actions:
        - assess-risk
        - request-approval
        - log-verdict

  # --- Reusable actions: callable by the agent above AND by other agents ---
  # --- / automations ("security checkpoint as a tool") ----------------------
  action:
    - key: assess-risk
      name: Assess risk
      description: >-
        Classify a planned action (and the text that requested it) as allow /
        hold-for-review / veto, with reasons. Read-only assessment: does not
        perform the action.
      function: assessRisk
      actionVerb: GET
      inputs:
        actionType:
          title: actionType
          type: string
          required: true
          description: 'Planned action, e.g. comment, transition, delete-issue, bulk-delete, change-permissions, share-external.'
        contentText:
          title: contentText
          type: string
          required: false
          description: Issue/comment/instruction text that requested the action (scanned for injection patterns).
        sourceType:
          title: sourceType
          type: string
          required: false
          description: 'Where the request came from: user-prompt, issue-description, comment, tool-output, webhook.'
        actorType:
          title: actorType
          type: string
          required: false
          description: 'Who wants to act: agent, automation, human.'
        externalRecipients:
          title: externalRecipients
          type: string
          required: false
          description: Comma-separated external email addresses/domains the action would send data to.
    - key: request-approval
      name: Request human approval
      description: >-
        Post a human approval card (comment) on the issue for a held action,
        summarising the verdict and reasons. The reviewed action is NOT
        executed; a human decides.
      function: requestApproval
      actionVerb: CREATE
      inputs:
        issueKey:
          title: issueKey
          type: string
          required: true
          description: Jira issue key the verdict belongs to.
        verdictJson:
          title: verdictJson
          type: string
          required: true
          description: Serialised verdict produced by assess-risk.
    - key: log-verdict
      name: Log verdict
      description: Append a verdict to the per-issue audit log in Forge storage.
      function: logVerdict
      actionVerb: CREATE
      inputs:
        issueKey:
          title: issueKey
          type: string
          required: true
          description: Jira issue key the verdict belongs to.
        verdictJson:
          title: verdictJson
          type: string
          required: true
          description: Serialised verdict produced by assess-risk.

  # --- Jira issue panel: veto / approval card UI ----------------------------
  rovo:mcp:
    - key: vetoreview-mcp
      name: VetoReview risk tools
      tools:
        - assess-risk

  jira:issuePanel:
    - key: vetoreview-panel
      resource: panel
      resolver:
        function: panelResolver
      title: VetoReview
      icon: https://example.com/vetoreview-icon.png # TODO: real icon asset

  # --- Function handlers -----------------------------------------------------
  function:
    - key: assessRisk
      handler: index.assessRisk
    - key: requestApproval
      handler: index.requestApproval
    - key: logVerdict
      handler: index.logVerdict
    - key: panelResolver
      handler: index.panelResolver

resources:
  - key: panel
    path: src/panel

# Permissions: MINIMAL set for the MVP.
# - read issues/pages so the agent can see what it is reviewing
# - write comments so it can post approval cards and verdict notes
# - app storage for the audit log
# Deliberately NOT requested: delete scopes, admin scopes, user admin —
# VetoReview judges actions, it never performs destructive ones.
permissions:
  scopes:
    - read:jira-work
    - write:jira-work # comments only in practice; used for approval cards
    - read:confluence-content.all
    - write:confluence-content # verdict notes on reviewed pages (MVP: comments)
    - storage:app

# --- Atlassian MCP exposure (bonus track: Best app with Atlassian MCP) ------
# Enabled in slice 4 (13 Nov): Atlassian docs now list rovo:mcp as Preview
# and fully supported, so assess-risk is exposed as an MCP tool external
# agents can call BEFORE acting. If a given site lacks Rovo/MCP, the app
# still qualifies for Best Agents via rovo:agent + actions above.
