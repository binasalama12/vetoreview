<!doctype html>
<!--
  VetoReview — Jira issue panel (Custom UI frontend).
  Static resource served from src/panel (manifest resource key: panel).
  The actual rendering lives in render.js (pure view-model → HTML, unit
  tested in test/panel-render.test.js); this page only mounts it and
  fetches the view model.

  Data flow (live wiring, slice 4):
    1. If the Forge bridge is present (the page runs inside Jira), ask
       the backend resolver for the view model:
         window.__forge_bridge__.invoke('panelResolver')
       loaded from the Forge global-bridge CDN script below.
    2. Fallbacks, in order: a host-injected
       window.__VETOREVIEW_VIEW_MODEL__ (local previews/tests), then the
       resolver's safe empty state. The panel never crashes the issue
       page — worst case it renders the empty state.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VetoReview</title>
    <style>
      body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 12px; color: #172b4d; }
      .vr-panel h3 { margin: 0 0 8px; font-size: 14px; }
      .vr-panel h4 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #5e6c84; }
      .vr-verdict { font-size: 16px; font-weight: 600; margin: 4px 0; }
      .vr-allow { color: #006644; }
      .vr-hold { color: #974f0c; }
      .vr-veto { color: #ae2a19; }
      .vr-unknown, .vr-empty { color: #5e6c84; }
      .vr-score, .vr-at, .vr-total, .vr-empty-note { margin: 4px 0; font-size: 13px; }
      .vr-context, .vr-tally, .vr-reasons, .vr-patterns { margin: 4px 0; padding-left: 18px; font-size: 13px; }
      .vr-patterns code { background: #f4f5f7; padding: 0 4px; border-radius: 3px; }
    </style>
    <script src="https://forge.cdn.prod.atlassian-dev.net/global-bridge.js"></script>
  </head>
  <body>
    <div id="vetoreview-panel">Loading VetoReview…</div>
    <script src="./render.js"></script>
    <script>
      (function () {
        var mount = document.getElementById('vetoreview-panel');
        var emptyView = {
          status: 'ready',
          issueKey: 'UNKNOWN',
          hasVerdict: false,
          latest: null,
          tally: { allow: 0, 'hold-for-review': 0, veto: 0 },
          totalEntries: 0
        };

        function render(view) {
          mount.innerHTML = window.VetoReviewPanel.renderPanel(view || emptyView);
        }

        var bridge = window.__forge_bridge__;
        if (bridge && typeof bridge.invoke === 'function') {
          bridge.invoke('panelResolver').then(render).catch(function () {
            render(window.__VETOREVIEW_VIEW_MODEL__ || emptyView);
          });
        } else {
          render(window.__VETOREVIEW_VIEW_MODEL__ || emptyView);
        }
      })();
    </script>
  </body>
</html>
